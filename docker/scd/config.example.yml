# ВРЕМЕННЫЙ ТЕСТОВЫЙ КОНФИГ scd (temporary test config, no real secrets).
# Будет заменён реальным конфигом владельца. Скопируйте в docker/scd/config.yml
# (файл в .gitignore), который монтирует docker-compose.yml в /app/config/config.yml.
#
# Подписка читается из локальной фикстуры с фейковыми VLESS-ссылками.
# Путь относительный (разрешается от каталога конфига):
#   локально:   docker/scd/../fixtures/subscription.txt
#   в Docker:   /app/config/../fixtures/subscription.txt = /app/fixtures/subscription.txt
# Поэтому docker-compose должен монтировать фикстуры для сервиса scd:
#   - ./docker/fixtures:/app/fixtures:ro

subscriptions:
  - id: test-fixture
    enabled: true
    # Источники подписки: каждый грузится, фильтруется и применяется отдельно.
    # id источника — префикс тегов (vless-…, in-vless-…, route-vless-…),
    # уникален в пределах подписки (одного Xray).
    sources:
      - id: vless
        type: vless
        input: ../fixtures/subscription.txt
        enabled: true
        format: auto
        fetchTimeoutMs: 5000
        # Ссылки с allowInsecure=1 без pcs/vcn: deny (по умолчанию) — пропускать, allow — принимать.
        # allowInsecure: deny
        # Доп. заголовки HTTP-запроса подписки (значения — секрет: в print-config и логах <redacted>),
        # например HWID из окружения:
        #   fetchHeaders:
        #     x-hwid: "${SCD_HWID}"
        # Предел размера входа (1 KiB..64 MiB, по умолчанию 64 MiB).
        # maxInputBytes: 67108864
        # Порты SOCKS-инбаундов источника внутри контейнера xray (наружу не публикуются);
        # диапазоны источников одной цели не пересекаются.
        portRange:
          start: 20000
          end: 20099
      # Кандидаты WireGuard (по строке wireguard:// на кандидата). input — только
      # абсолютный путь к обычному файлу с правами 0600 (группа и остальные без доступа).
      # В Xray ставятся не больше maxActive кандидатов, выбранных по selection.strategy.
      # Выключен: файла кандидатов в примере нет.
      - id: wg
        type: wireguard
        input: /app/wgp/wg
        enabled: false
        portRange:
          start: 20100
          end: 20109
        maxActive: 2
        selection:
          strategy: score          # score | load | label
          switchMarginPercent: 20
          switchConfirmChecks: 2
          deadPairCooldownMinutes: 10
          replaceAfterFailures: 2
        # Переопределение target.monitor для туннелей источника: отказ WG виден
        # только как таймаут, первый handshake бывает долгим.
        monitor:
          request:
            timeoutMs: 10000
          retry:
            attempts: 2
            delayMs: 2000
        filters:
          countryAllowlist: [NL, CH]       # страна выхода (exit, иначе флаг label)
          entryCountryAllowlist: [NL, CH]  # страна входа (entry, иначе флаг label)
        wireguard:
          endpointDomainStrategy: UseIPv4
      # Кандидаты MASQUE (по строке masque:// на транспорт h3/h2 ключа устройства).
      # Правила input — как у wireguard. На ключ устройства активен один кандидат:
      # новый берётся с наименьшим priority вне карантина «ключ + endpoint + transport».
      # В Xray всегда security: tls. Выключен: файла кандидатов в примере нет.
      - id: mq
        type: masque
        input: /app/wgp/warpmq
        enabled: false
        portRange:
          start: 20110
          end: 20119
        maxActive: 1
        selection:
          strategy: label
          switchMarginPercent: 20
          switchConfirmChecks: 2
          deadPairCooldownMinutes: 10
          replaceAfterFailures: 2
        monitor:
          request:
            timeoutMs: 10000
          retry:
            attempts: 2
            delayMs: 2000
    target:
      # Сервис xray из docker-compose.yml; gRPC API слушает 0.0.0.0:8080
      # (docker/xray/config/01_api.json).
      address: xray:8080
      timeoutMs: 5000
      # Статические ресурсы из docker/xray/config/*.json — scd их не удаляет.
      fixedOutbounds:
        - direct     # 06_outbound.json
        - blocked    # 06_outbound.json
        - api        # тег API (01_api.json)
      fixedInbounds:
        - socks-proxy  # 03_inbound.json
        - wg-proxy     # 03_inbound.json
        - api          # тег API (01_api.json)
      fixedRouting:
        - direct       # 04_routing.json ruleTag
        - x-balancer   # 04_routing.json ruleTag
      # Совпадает с observatory.subjectSelector и balancers[].selector
      # (04_routing.json / 05_observatory.json).
      observatorySubjectSelectorPrefix: x-observe-
      # Адрес сгенерированных SOCKS-инбаундов; порты — в sources[].portRange.
      inboundSocks:
        listen: 0.0.0.0
      # Мониторинг выключен: хосты в фикстуре фейковые, проверки всегда падали бы.
      monitor:
        enabled: false
      balancerMonitor:
        enabled: false
      # Какой outbound сейчас выбирает балансер Xray (карточка «Xray selection»
      # на дашборде, D22): read-only опрос GetBalancerInfo + GetOutboundStatus.
      # balancerTag = routing.balancers[].tag (04_routing.json), не ruleTag.
      # Расписание с секундами (6 полей) = probeInterval observatory (15s).
      # Требует "ObservatoryService" в api.services (01_api.json) и секцию
      # observatory (05_observatory.json), иначе Xray не стартует.
      balancerSelection:
        enabled: true
        balancerTag: x-balancer
        schedule: "*/15 * * * * *"

runtime:
  # Dockerfile запускает `daemon`, поэтому нужен режим daemon + расписание.
  mode: daemon
  schedule: "*/5 * * * *"

logging:
  level: info
  format: pretty

resources:
  outbounds:
    enabled: true
  inbounds:
    enabled: true
  routing:
    enabled: true

statusServer:
  enabled: true
  # Внутри контейнера 8080; compose публикует как 127.0.0.1:9090.
  listen: 0.0.0.0:8080
  instanceId: scd-test
  runtimeState:
    enabled: true
    includeRaw: false
    includeSecrets: false
