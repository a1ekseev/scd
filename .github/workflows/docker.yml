name: Docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

jobs:
  # Runs on pull requests, master and release tags; publish needs it.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check Xray version pin
        run: bash scripts/check-xray-version.sh

      - name: Check Go-only tree
        run: bash scripts/check-no-node.sh

      - name: Vet
        run: |
          go vet ./...
          go vet -tags 'xraylive visual' ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Download Xray
        run: |
          read -r xray_version _ < .xray-version
          base="https://github.com/XTLS/Xray-core/releases/download/v${xray_version}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/Xray-linux-64.zip"
          curl -fsSLO "$base/Xray-linux-64.zip.dgst"
          want=$(tr -d '\r' < Xray-linux-64.zip.dgst | sed -n 's/^SHA2-256= *//p')
          got=$(sha256sum Xray-linux-64.zip | cut -d' ' -f1)
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "Xray-linux-64.zip sha256 $got does not match .dgst SHA2-256 '$want'" >&2
            exit 1
          fi
          unzip -q Xray-linux-64.zip -d xray
          ./xray/xray version

      - name: Run live Xray tests
        run: SCD_XRAY_BIN="$RUNNER_TEMP/xray/xray" go test -tags xraylive -race -count=1 ./internal/scd/livetest/...

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run dashboard visual regression
        run: SCD_CHROME=${{ steps.chrome.outputs.chrome-path }} go test -tags visual -count=1 ./internal/scd/status/...

      - name: Build
        run: go build -o bin/scd ./cmd/scd

      - name: Validate example configs
        run: |
          ./bin/scd validate-config --config docker/scd/config.example.yml
          ./bin/scd sfc validate-config --config docker/sfc/config.example.yml
          ./bin/scd gtl validate-config --config docker/gtl/config.example.yml
          ./bin/scd wgp validate-config --config docker/wgp/config.example.yml

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate compose files
        # compose-smoke.sh sets SCD_SMOKE_SCD_CONFIG to a copy of the example
        # with a faster schedule and the wgp inputs to temp copies. `config -q`
        # does not read them: the key is /dev/null, the static dir the fixtures.
        env:
          SCD_SMOKE_SCD_CONFIG: ./docker/scd/config.example.yml
          SCD_SMOKE_WGP_STATIC: ./docker/fixtures/static
          SCD_SMOKE_WGP_KEY: /dev/null
        run: docker compose --profile wgp -f docker-compose.yml -f docker/compose.smoke.yml config -q

      - name: Compose smoke
        run: bash scripts/compose-smoke.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/a1ekseev/scd
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=scd
            org.opencontainers.image.description=Subscription Control Daemon (scd, sfc, gtl, wgp)

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
