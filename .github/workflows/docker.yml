name: Docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            scd/package-lock.json
            sfc/package-lock.json
            gtl/package-lock.json

      - name: Install dependencies
        working-directory: ./scd
        run: npm ci

      - name: Typecheck
        working-directory: ./scd
        run: npm run typecheck

      - name: Run tests
        working-directory: ./scd
        run: npm test

      - name: Install sfc dependencies
        working-directory: ./sfc
        run: npm ci

      - name: Typecheck sfc
        working-directory: ./sfc
        run: npm run typecheck

      - name: Run sfc tests
        working-directory: ./sfc
        run: npm test

      - name: Install gtl dependencies
        working-directory: ./gtl
        run: npm ci

      - name: Typecheck gtl
        working-directory: ./gtl
        run: npm run typecheck

      - name: Run gtl tests
        working-directory: ./gtl
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./scd
          file: ./scd/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sfc Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./sfc
          file: ./sfc/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gtl Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./gtl
          file: ./gtl/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  go:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Download Xray 26.10.10
        run: |
          base=https://github.com/XTLS/Xray-core/releases/download/v26.10.10
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/Xray-linux-64.zip"
          curl -fsSLO "$base/Xray-linux-64.zip.dgst"
          want=$(sed -n 's/^SHA2-256= *//p' Xray-linux-64.zip.dgst)
          got=$(sha256sum Xray-linux-64.zip | cut -d' ' -f1)
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "Xray-linux-64.zip sha256 $got does not match .dgst SHA2-256 '$want'" >&2
            exit 1
          fi
          unzip -q Xray-linux-64.zip -d xray
          ./xray/xray version

      - name: Run live Xray tests
        run: SCD_XRAY_BIN="$RUNNER_TEMP/xray/xray" go test -tags xraylive -race -count=1 ./internal/scd/livetest/...

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run dashboard visual regression
        run: SCD_CHROME=${{ steps.chrome.outputs.chrome-path }} go test -tags visual -count=1 ./internal/scd/status/...

      - name: Build
        run: go build -o bin/scd ./cmd/scd

      - name: Smoke check
        run: ./bin/scd --help

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            scd/package-lock.json
            sfc/package-lock.json
            gtl/package-lock.json

      - name: Install dependencies
        working-directory: ./scd
        run: npm ci

      - name: Typecheck
        working-directory: ./scd
        run: npm run typecheck

      - name: Run tests
        working-directory: ./scd
        run: npm test

      - name: Install sfc dependencies
        working-directory: ./sfc
        run: npm ci

      - name: Typecheck sfc
        working-directory: ./sfc
        run: npm run typecheck

      - name: Run sfc tests
        working-directory: ./sfc
        run: npm test

      - name: Install gtl dependencies
        working-directory: ./gtl
        run: npm ci

      - name: Typecheck gtl
        working-directory: ./gtl
        run: npm run typecheck

      - name: Run gtl tests
        working-directory: ./gtl
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/a1ekseev/scd
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=scd
            org.opencontainers.image.description=Subscription Control Daemon

      - name: Extract sfc Docker metadata
        id: meta_sfc
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/a1ekseev/sfc
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=sfc
            org.opencontainers.image.description=Subscription Filter Control

      - name: Extract gtl Docker metadata
        id: meta_gtl
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/a1ekseev/gtl
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=gtl
            org.opencontainers.image.description=Gen Test Load

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./scd
          file: ./scd/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sfc Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./sfc
          file: ./sfc/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_sfc.outputs.tags }}
          labels: ${{ steps.meta_sfc.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gtl Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./gtl
          file: ./gtl/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_gtl.outputs.tags }}
          labels: ${{ steps.meta_gtl.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
